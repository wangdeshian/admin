<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>行政流程與交接｜連結共用版</title>
<link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="canvas.css?v=align3"><script type="module" src="board.mjs?v=align3"></script>
<style>
[hidden]{display:none!important}
.workhead h2{font-size:1.75rem}
.view-switch{display:inline-flex;padding:3px;background:#e9efea;border:1px solid var(--line);border-radius:11px;gap:3px}
.view-switch button{border:0;background:transparent;min-height:37px;padding:.35rem .72rem;font-size:.9rem}
.view-switch button[aria-pressed=true]{background:white;color:var(--accent);box-shadow:0 1px 4px #15332825}
.group{scroll-margin-top:12px}
</style>
</head>
<body>
<header class="mast"><div class="wrap top"><span class="brand"><span aria-hidden="true">▤</span> 行政工作台 · 連結共用版</span><div class="tools"><button id="login" type="button" hidden>用 Google 登入</button><button id="logout" type="button" hidden>登出</button><button id="backup" hidden>清單備份／匯入</button></div></div></header>
<div class="wrap notice" id="cloudStatus" role="status">正在連接共用看板…</div>
<main class="wrap" id="boardMain" hidden>
<div class="hero-actions cv-old-actions" id="oldActions" hidden><button class="primary" id="newItem">＋ 新增工作項目</button><button id="newGroup">＋ 新增流程區塊</button></div>
<section id="stats" class="stats" aria-label="工作摘要"></section>
<section class="work">
<div class="workhead cv-workhead"><h1>行政流程看板</h1><div class="view-switch" role="group" aria-label="顯示方式"><button type="button" id="canvasMode" aria-pressed="true">自由編排</button><button type="button" id="listMode" aria-pressed="false">全部清單</button></div></div>
<section id="canvasPanel" aria-label="自由編排流程畫布">
<div class="cv-toolbar"><div class="cv-edge-tools"><button type="button" class="primary" id="canvasAdd" disabled>＋ 新增圖卡</button><button type="button" id="canvasCancelLink" hidden>取消連線</button><label for="canvasEdgeList" class="sr">選擇箭頭</label><select id="canvasEdgeList"><option value="">選擇要移除的箭頭</option></select><button type="button" id="canvasRemoveEdge" disabled>移除箭頭</button></div><div class="cv-zoom" role="group" aria-label="畫布檢視"><button type="button" id="canvasZoomOut" aria-label="縮小畫布">−</button><button type="button" id="canvasZoomReset" title="回到原始大小" aria-label="回到原始大小，100%">100%</button><button type="button" id="canvasZoomIn" aria-label="放大畫布">＋</button><button type="button" id="canvasExpand" aria-pressed="false">全畫面</button></div></div>
<div class="cv-meta"><p class="cv-hint">拖動「⠿」靠近同一排或同一列會自動對齊；按住 Shift 可暫停對齊。<span id="canvasHint">點兩張圖卡的圓點即可連線。</span></p><div id="canvasStatus" class="cv-status" role="status">正在載入畫布…</div></div>
<div class="cv-scroll" id="canvasScroll" tabindex="0" aria-label="圖卡畫布，可上下左右捲動"><div class="cv-surface" id="canvasSurface"><svg id="canvasLinks" class="cv-svg" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><marker id="cvArrow" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#2c6daf"/></marker></defs><g id="canvasPaths"></g></svg><div id="canvasGuideX" class="cv-guide cv-guide-x" aria-hidden="true" hidden></div><div id="canvasGuideY" class="cv-guide cv-guide-y" aria-hidden="true" hidden></div><div id="canvasCards"></div></div></div>
</section>
<div id="legacyPanel" hidden><div class="filter"><label><span class="sr">搜尋</span><input type="search" id="query" placeholder="搜尋項目、主責、接手人"></label><label><span class="sr">篩選狀態</span><select id="filter"><option value="">全部項目</option><option>待分工</option><option>待開始</option><option>進行中</option><option>待交接</option><option>已完成</option><option>已逾期</option></select></label></div>
<div id="board"></div>
</div></section>
<footer>持有完整連結的人都能查看和修改。請勿填寫客戶資料、照護資訊或其他個資。</footer>
</main>
<dialog id="editor" aria-labelledby="editTitle"><form id="form"><div class="dialoghead"><h2 id="editTitle"></h2><button type="button" data-close aria-label="關閉">✕</button></div><div id="fields" class="fields"></div><p id="editError" class="error" role="alert"></p><div class="dialogfoot"><button type="button" data-close>取消</button><button class="primary" type="submit">儲存</button></div></form></dialog>
<dialog id="backupDialog" aria-labelledby="backupTitle"><div class="dialoghead"><h2 id="backupTitle">備份與還原</h2><button type="button" data-close aria-label="關閉">✕</button></div><p>匯出會下載目前整份看板。匯入會取代所有人看到的整份共用看板。請勿匯入含私人或敏感資訊的備份，並先匯出目前的共用看板。</p><p id="backupError" class="error" role="alert"></p><div class="dialogfoot"><button id="exportBtn">匯出 JSON</button><button class="primary" id="importBtn">匯入備份</button><input type="file" id="backupFile" accept=".json,application/json" hidden></div></dialog>
<dialog id="canvasDialog" aria-labelledby="canvasDialogTitle"><form id="canvasForm"><div class="dialoghead"><h2 id="canvasDialogTitle">新增圖卡</h2></div><div class="fields"><label class="field wide"><span>圖卡標題</span><input id="canvasTitle" maxlength="120" required></label><section class="wide cv-work" aria-labelledby="cvWorkLabel"><div class="cv-work-head"><strong id="cvWorkLabel">工作項目</strong><strong>負責行政</strong></div><div id="canvasWorkRows"></div><button type="button" id="canvasAddWork">＋ 新增工作項目</button><details id="canvasRosterPanel"><summary>新增行政人員</summary><p>建議用暱稱或代號。名單會和圖卡一起儲存，持有連結的人都看得到。</p><div class="cv-roster-entry"><input id="canvasRosterName" maxlength="40" aria-label="行政人員暱稱或代號" placeholder="輸入暱稱或代號"><button type="button" id="canvasRosterAdd">加入名單</button></div><p id="canvasRosterStatus" role="status"></p></details></section></div><p id="canvasError" class="error" role="alert"></p><div class="dialogfoot"><button type="button" id="canvasDelete" class="danger" hidden>刪除圖卡</button><button type="button" id="canvasCancel">取消</button><button type="submit" class="primary">儲存圖卡</button></div></form></dialog>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
